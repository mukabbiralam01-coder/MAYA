<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with dark futuristic border -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#cyber)" stroke-width="4" opacity="0.6" />

  <!-- Outer Cyber Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyber)" stroke-width="3" stroke-dasharray="20 10 5 10" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neon)" stroke-width="4" stroke-dasharray="40 15 20 15" opacity="0.7" />

  <!-- Glowing Core Orb -->
  <circle cx="256" cy="256" r="85" fill="#083344" filter="url(#glow)" />
  <circle cx="256" cy="256" r="75" fill="url(#cyber)" filter="url(#glow)" opacity="0.9" />
  <circle cx="256" cy="256" r="45" fill="#ffffff" opacity="0.95" />

  <!-- Holographic Waveforms -->
  <path d="M 170 256 Q 213 190 256 256 T 342 256" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 190 256 Q 223 300 256 256 T 322 256" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Letter Z Stylized -->
  <text x="256" y="420" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#22d3ee" text-anchor="middle" letter-spacing="8" opacity="0.95">ZOYA AI</text>
</svg>
